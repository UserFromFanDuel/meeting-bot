name: DST Reminder

on:
  schedule:
    - cron: '0 1 31 10 0'
    - cron: '0 1 31 3 0'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify DST Change
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-type: application/json' \
            -d '{
              "text": "⏰ **DST Change Alert**",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🕐 *DST Time Change in Romania*\n\nThe bot schedule needs updating:\n\n*Late March (Summer Time):*\nChange cron to: `0 12 * * 1-5`\n\n*Late October (Winter Time):*\nChange cron to: `0 7 * * 1-5`\n\nFile: `.github/workflows/run-bot.yml`"
                  }
                }
              ]
            }'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
