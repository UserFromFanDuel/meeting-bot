name: Run meeting bot

on:
  schedule:
    # 9 AM Eastern European Summer Time (GMT+3)
    # = 12:00 UTC, Monday-Friday
    - cron: '0 12 * * 1-5'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run bot
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
          MEETING_CHANNEL_ID: ${{ secrets.MEETING_CHANNEL_ID }}
        run: python meeting_leader_bot.py
