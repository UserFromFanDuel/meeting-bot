name: Run meeting bot

on:
  schedule:
    - cron: '0 4 * * 1-5'
  workflow_dispatch:

jobs:
  run_bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run meeting bot (with automatic retry - 3 attempts, 10 min interval)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
          MEETING_CHANNEL_ID: ${{ secrets.MEETING_CHANNEL_ID }}
        run: |
          for attempt in 1 2 3; do
            echo "🔄 Attempt $attempt of 3..."
            if python meeting_leader_bot.py; then
              echo "✅ Success on attempt $attempt"
              exit 0
            else
              if [ $attempt -lt 3 ]; then
                echo "❌ Attempt $attempt failed. Waiting 10 minutes before retry..."
                sleep 600
              else
                echo "❌ All 3 attempts failed"
                exit 1
              fi
            fi
          done
